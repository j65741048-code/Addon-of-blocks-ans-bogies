name: Build (Fabric 1.20.1)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Installs Gradle itself, so gradlew / gradle-wrapper.jar are not needed in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      # Finds settings.gradle wherever it was uploaded (repo root or a subfolder).
      - name: Locate Gradle project
        run: |
          f="$(find . -maxdepth 3 -name 'settings.gradle*' -not -path './.git/*' -not -path '*/libs/*' | head -n1)"
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle found in this repo. Upload settings.gradle, build.gradle, gradle.properties and the src folder."
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "Gradle project found in: $(dirname "$f")"

      # Self-contained: no scripts/ folder needed in the repo.
      - name: Fetch Create Fabric 1.20.1 and its libraries
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          CREATE_VERSION: 6.0.8.1+build.1744-mc1.20.1
        run: |
          set -uo pipefail
          mkdir -p libs
          UA="western-bogies-build (github actions)"
          API="https://api.modrinth.com/v2/project"
          Q='loaders=%5B%22fabric%22%5D&game_versions=%5B%221.20.1%22%5D'
          fetch() {
            local slug="$1" want="${2:-}" json url=""
            json="$(curl -fsSL -H "User-Agent: $UA" "$API/$slug/version?$Q")" || { echo "WARN: cannot query $slug"; return 1; }
            if [ -n "$want" ]; then
              url="$(echo "$json" | jq -r --arg v "$want" '[.[]|select(.version_number==$v)][0].files|map(select(.primary))[0].url // empty')"
            fi
            if [ -z "$url" ]; then
              url="$(echo "$json" | jq -r '([.[]|select(.version_type=="release")][0] // .[0]).files|map(select(.primary))[0].url // empty')"
            fi
            [ -n "$url" ] || { echo "WARN: no 1.20.1 fabric file for $slug"; return 1; }
            echo "Downloading $slug -> $url"
            curl -fsSL -H "User-Agent: $UA" -o "libs/$slug.jar" "$url"
          }
          fetch create-fabric "$CREATE_VERSION" || exit 1
          fetch flywheel || true
          fetch ponder || true
          fetch catnip || true
          # Extract Create's jar-in-jar libraries so the compiler can see them
          mkdir -p build/nested
          unzip -o -q libs/create-fabric.jar 'META-INF/jars/*.jar' -d build/nested 2>/dev/null || true
          if [ -d build/nested/META-INF/jars ]; then cp -n build/nested/META-INF/jars/*.jar libs/ || true; fi
          ls -la libs

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --console=plain --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: western-bogies-fabric-1.20.1
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/build/reports
          if-no-files-found: ignore
